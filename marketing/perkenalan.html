<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Perkenalan Revize (A)</title>
<link rel="stylesheet" href="shared.css">
<style>
  .post { background: var(--color-violet); color: var(--color-cream); }
  .art { color: var(--color-plum); }
  header { display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 112px; margin-top: 64px; }
  h1 em { font-style: normal; color: var(--color-lime); }
  .body { margin-top: 40px; max-width: 800px; }
  .actions { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .cta { background: var(--color-lime); color: var(--color-ink); }
  .cta svg { width: 40px; height: 40px; }
  .badge { width: 132px; height: 132px; border-radius: 50%; background: var(--color-lime); color: var(--color-ink); display: grid; place-items: center; }
  .badge svg { width: 60px; height: 60px; }
</style>
</head>
<body>
<section class="post">
  <svg class="art" viewBox="0 0 1080 1350" stroke-width="64" aria-hidden="true">
    <path d="M-120 1230C180 1010 460 1410 760 1190S1040 980 1220 1070" />
    <path d="M-120 1330C220 1110 540 1480 860 1250S1100 1100 1220 1150" />
    <path d="M640 -90C740 120 930 190 1220 130" />
  </svg>

  <header>
    <span class="wordmark">Revize</span>
  </header>

  <span class="pill outline" style="margin-top:72px">Creative agency untuk UMKM</span>
  <h1 class="display">Brand yang <em>berani</em>, website yang diingat.</h1>
  <p class="body">Kami bantu UMKM punya website dan identitas brand yang profesional dan cepat online.</p>

  <div class="actions">
    <span class="pill cta">
      Konsultasi gratis via WhatsApp
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
    <span class="badge">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6H22l-6.2 4.6 2.4 7.6-6.2-4.7-6.2 4.7 2.4-7.6L2 9.6h7.6z"/></svg>
    </span>
  </div>
</section>
</body>
</html>
