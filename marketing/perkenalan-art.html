<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Perkenalan Revize (B, artistik)</title>
<link rel="stylesheet" href="shared.css">
<!-- Filosofi visual: perkenalan-art.md -->
<style>
  .post { background: var(--color-cream); color: var(--color-ink); }
  .art { color: var(--color-violet); }
  .art text { fill: var(--color-ink); stroke: none; font-family: var(--font-display); font-weight: 800; font-size: 72px; letter-spacing: -0.04em; }
  .text { margin-top: auto; }
  h1 { font-size: 88px; margin-top: 36px; }
  h1 span { display: inline-block; background: var(--color-violet); color: var(--color-cream); border-radius: 999px; padding: 0.02em 0.32em 0.1em; }
  .body { margin-top: 36px; max-width: 820px; }
  .cta { margin-top: 48px; background: var(--color-ink); color: var(--color-cream); }
  .cta svg { width: 40px; height: 40px; }
</style>
</head>
<body>
<section class="post">
  <svg class="art" viewBox="0 0 1080 1350" aria-hidden="true">
    <g transform="translate(0 -60) rotate(-8 800 330)">
      <!-- The line enters from the left edge and closes on itself into an oval. -->
      <path stroke-width="48" d="M-80 190C220 120 480 150 480 330A320 180 0 1 0 1120 330A320 180 0 1 0 480 330" />
      <circle cx="480" cy="330" r="34" fill="var(--color-lime)" stroke="none" />
    </g>
    <text x="800" y="296" text-anchor="middle">Revize</text>
  </svg>

  <div class="text">
    <span class="pill outline">Creative agency untuk UMKM</span>
    <h1 class="display">Brand yang <span>berani</span>, website yang diingat.</h1>
    <p class="body">Kami bantu UMKM punya website dan identitas brand yang profesional dan cepat online.</p>
    <span class="pill cta">
      Konsultasi gratis via WhatsApp
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
  </div>
</section>
</body>
</html>
